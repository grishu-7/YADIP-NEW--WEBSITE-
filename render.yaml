services:
  - type: web
    name: yadip-premium
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OUTBOUND_TIMEOUT_MS
        value: "15000"

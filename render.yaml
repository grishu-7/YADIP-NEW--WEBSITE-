services:
  - type: web
    name: yadip-premium
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OUTBOUND_TIMEOUT_MS
        value: "15000"
      - key: RESELLER_API_URL
        sync: false
      - key: RESELLER_API_KEY
        sync: false
      - key: RESELLER_MASTER_KEY
        sync: false
      - key: RESELLER_DEFAULT_PID
        sync: false
      - key: RESELLER_DEFAULT_DURATION
        sync: false
      - key: FAMPAY_CREATE_ORDER_URL
        sync: false
      - key: FAMPAY_VERIFY_ORDER_URL
        sync: false
      - key: FAMPAY_API_KEY
        sync: false
      - key: FAMPAY_WEBHOOK_SECRET
        sync: false
      - key: FAMPAY_WEBHOOK_URL
        sync: false
      - key: FAMPAY_REDIRECT_URL
        sync: false
